spring.application.name=moneycopilot

# Datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:moneycopilot}
spring.datasource.username=${DB_USERNAME:moneycopilot}
