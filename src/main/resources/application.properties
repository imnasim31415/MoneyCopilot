spring.application.name=moneycopilot

# Datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:moneycopilot}
spring.datasource.username=${DB_USERNAME:moneycopilot}
spring.datasource.password=${DB_PASSWORD:moneycopilot_dev}

# JPA
spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Swagger UI
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs
